<div class="container text-center">
    <br>
    <div class="row">
        <div class="col-md-12">
            <h1>Ingreso sistema</h1>
            <hr>
        </div>
    </div>
    <form (ngSubmit)="login()" id="formulario">
        <div class="row">
            <div class="col-md-3">
                <label class="form-label">Usuario</label>
            </div>
            <div class="col-md-9">
                <input type="text" [(ngModel)]="administrador.usuario" [ngModelOptions]="{standalone: true}" required
                    class="form-control">
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-3">
                <label class="form-label">Password</label>
            </div>
            <div class="col-md-9">
                <input type="password" [(ngModel)]="administrador.password" [ngModelOptions]="{standalone: true}"
                    required class="form-control">
            </div>
        </div>
        <br>

        <input type="submit" value="Ingresar" class="btn btn-success btn-lg">

    </form>
</div>
